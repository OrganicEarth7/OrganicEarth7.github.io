<html><head><style>
  /* --- FONT DEFINITIONS --- */
  
  @font-face {
    font-family: "Irresponsible";
    src: url("raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/Irresponsible Direction.ttf") format("truetype");
  }
  @font-face {
    font-family: "Baron";
    src: url("http://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/Baron%20Kuffner.otf") format("opentype");
  }
  @font-face {
    font-family: "WrongTime";
    src: url("https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/Wrong time%2C right place.ttf") format("truetype");
  }
  @font-face {
    font-family: "Misproject";
    src: url("http://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/MISPROJE.TTF") format("truetype");
  }

  body {
    font-family: sans-serif;
    overflow: hidden;
    background-color: black;
    margin: 0;
  }

  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  .bg-layer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    object-fit: cover;
    transition: opacity 2s ease-in-out;
  }
 
  #bgBack  { z-index: 0; opacity: 1; }
  #bgFront { z-index: 1; opacity: 0; }
 


  h1 {
    position: absolute;
    font-family: "Irresponsible";
    font-size: 75px;
    white-space: nowrap;
    transform-origin: center bottom;
    background: linear-gradient(to top, #500000 0%, #ff0000 100%, #ff99cc 0%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
      drop-shadow(2px 0px 0px black)
      drop-shadow(-2px 0px 0px black)
      drop-shadow(0px 2px 0px black)
      drop-shadow(0px -2px 0px black);
  }

  h1 span {
    display: inline-block;
    background: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .top {
    position: absolute;
    top: 75%;
    left: 23%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .bottom {
    position: absolute;
    top: 85%;
    left: 23%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  #server-badge {
    position: absolute;
    top: 48px;
    right: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;

  }

  #server-badge img {
    height: 175px;
    width: 175px;
    object-fit: contain;
    z-index: 2;
  }

  #server-badge-name {
    font-family: "WrongTime", sans-serif;
    font-size: 128px;
    letter-spacing: 3px;
    white-space: nowrap;
    background: linear-gradient(to top, #500000 0%, #ff0000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
      drop-shadow(1px 0px 0px black)
      drop-shadow(-1px 0px 0px black)
      drop-shadow(0px 1px 0px black)
      drop-shadow(0px -1px 0px black);
  }
  
#mapname-display {
  position: absolute;
  top: 225px;
  right: 48px;
  text-align: right;
  z-index: 2;
  font-family: "WrongTime", sans-serif;
  font-size: 72px;
  white-space: nowrap;
  background: linear-gradient(to top, #500000 0%, #ff0000 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter:
    drop-shadow(1px 0px 0px black)
    drop-shadow(-1px 0px 0px black)
    drop-shadow(0px 1px 0px black)
    drop-shadow(0px -1px 0px black);
}

</style>

</head><body>
<audio id="vid" autoplay="" loop="" style="display:none;">
  <source type="audio/mpeg">
</audio>

<div class="container">

    <img class="bg-layer" id="bgBack"  src="">
  <img class="bg-layer" id="bgFront" src="">

  
<div id="mapname-display"></div>

  <div id="server-badge">
    <img src="https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/sycmotdtest.png" alt="Sycosuia logo">
    <span id="server-badge-name">SYCOSUIA</span>
  </div>

  <h1 class="top anim-enter" id="top" style="font-family: Irresponsible;"></h1>
  <h1 class="bottom anim-enter" id="bottom" style="font-family: PlasticMachine;"></h1>
</div>

<script>
  var rareEvents = [
    {

      music: "",

      bottomText: ""
    },
  ];

  var combinedTexts = [
    "THIS CARCASS IS MY ARENA. - SHOW ME A FIGHT.",
    "AT LORDS CONVERGING - IN THEIR PLACE",
    "WE HAVE WAITED FOR THIS MOMENT. - WE KNOW YOUR FATE",
    "WE ARE FESTERING AND ANGRY - WE WANT A FIGHT.",
    "INFECTED ROT PLAGUES YOUR LAND. - FIGHT IT OFF, WE KNOW YOU CAN.",
    "THE GROX WERE BABIES - SO IS THE BUG",
    "OUR BLOOD WILL PAINT - THESE WALLS SCARLET",
    "OUR WAR LASTS FOREVER - JOIN US",
    "YOU WILL WAKE UP EVERY TIME - CONTINUE THE FIGHT",
    "THEY ARE COMING FOR YOU - AND THEY ARE HUNGRY",
    "PSYCOPATHS PLAGUE THIS WORLD - RESISTANCE IS MANDATORY",
    "WAR IS ETERNAL - THERE IS NO PEACE",
    "FIGHT US - WE WANT TO SEE YOUR STRENGTH",
    "STREET_BLOX53 - ON YOUTUBE DOT COM",

    /* --- DESPAIR & HOPELESSNESS --- */
    "DONT RUN AWAY - WE WANT TO SEE YOUR STRENGTH",
    "NO ONE IS COMING TO SAVE YOU - FIGHT TO THE BITTER END",
    "THE CARCASS CALLS FOR BLOOD - SACRIFICE EVERYONE YOU SEE",
    "ALL ROADS LEAD TO - OUR ETERNAL WARFARE",
    "THE BARON IS HERE - THE END IS COMING",
    "SOMETHING WRITHES - UNDERNEATH",
    "THE GOD RIB - WRITHES IN THE SAND",
    "HIS BLOOD RUSTED STEEL - WAITS TO BE RECLAIMED",
    "THE ILL WILLING STAR - SHINES FOR ITS RECLAIMER",
    "THE TWIN GOLDEN AGONIES - WAIL IN THE DISTANCE",
    "RETURN TO HIM - HIS SIXTH HORN",

    /* --- COMEDIC/ABSURD THREATS --- */
    "I'M GOING TO PUSH YOU - INTO THE SUN'S CORE",
    "YOUR COLLECTION OF FUNKO POPS - WILL BE MELTED DOWN",
    "WE CAN FEEL YOUR POWER - SHOW US YOUR MIGHT",
    "WE WILL HUNT YOU DOWN - UNTIL YOUR LAST BREATH",
    "BUGS GET STUFFED - INTO TAXIDERMY DISPLAYS",
    "DEATH IS NOT THE END - WE WILL FIGHT FOREVER",
    "A KILLZONE SPAWNED - GO GET IT DUDE",
    "DUDE PUT THAT AWAY - THERE'S KIDS HERE",
    "THE DARKNESS IS A TRAP - RESIST ITS PULL",
    "S.T.A.R.S - ",
    "hi - ",
    "I JUST SHIT MYSELF - CAN YOU HELP ME",
  ];

  var slideshowImages = [
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/ghoulish.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/fortnite.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/ruinous_damage.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/loadingpic1.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/sanidoomcredited.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/novenkachaos.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/originsflames.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/atomicwarfare.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/grandhumidrooks.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/morenovenka.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/redskies.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/pumkin.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/redskies.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/unsyc.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/bigcitybattle2.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/theresmanypeeled.png",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/ohmygod.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/fogman.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/apocalypse.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/highwayofdeath.JPG",
    "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/stop_talking._youre_gonna_get_us_killed.png",
  ];
 

  var firstDelay   = 5000;  
  var cycleDelay   = 7000;  
  var fadeDuration = 2000;  
 

  var bgMusicPairs = [
/*  {
      background: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/stop_talking._youre_gonna_get_us_killed.png",
      music: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/bugrelic.mp3"
    },
*/
    {
      background: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/sanidoomcredited.png",
      music: "http://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/neverlookbackatbugs.mp3"
    },
/*  {
      background: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/loading2.png",
      music: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/themine.mp3"
    },
    {
      background: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/MAJOR_Turbulence.png",
      music: "https://raw.githubusercontent.com/OrganicEarth7/OrganicEarth7.github.io/main/Slow-Crushed%20By%20Overwhelming%20Force(1).mp3"
    },
*/
  ];

  var fonts = ["WrongTime"];

  // --- Rare event roll ---
  var chosenRare = null;
  for (var i = 0; i < rareEvents.length; i++) {
    if (Math.random() < rareEvents[i].chance) {
      chosenRare = rareEvents[i];
      break;
    }
  }

  // --- Background & music ---
  var bgBack  = document.getElementById("bgBack");
  var bgFront = document.getElementById("bgFront");
  var audio   = document.getElementById("vid");

  var firstBg;
  if (chosenRare) {
    firstBg   = chosenRare.background;
    audio.src = chosenRare.music;
  } else {
    var randomPair = bgMusicPairs[Math.floor(Math.random() * bgMusicPairs.length)];
    firstBg   = randomPair.background;
    audio.src = randomPair.music;
  }

  bgBack.src  = firstBg;
  bgFront.src = firstBg;
 
  audio.volume = 0.1;
  var playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise.catch(function(error) { console.log("Autoplay prevented"); });
  }
 

  var lastSlide = firstBg;
 
  function pickNextSlide() {
    var pool = slideshowImages.filter(function(url) { return url !== lastSlide; });
    if (pool.length === 0) pool = slideshowImages; 
    return pool[Math.floor(Math.random() * pool.length)];
  }
 
  function crossfadeTo(nextUrl) {
    bgFront.src    = nextUrl;
    bgFront.style.opacity = "0";
 
    bgFront.onload = function() {
      bgFront.style.opacity = "1";
 
      setTimeout(function() {
        bgBack.src            = nextUrl;
        bgFront.style.opacity = "0";
        lastSlide             = nextUrl;
      }, fadeDuration);
    };
  }
 
  function startSlideshow() {
    setInterval(function() {
      crossfadeTo(pickNextSlide());
    }, cycleDelay);
  }

  setTimeout(startSlideshow, firstDelay);
 
  // --- Captions ---
  var topEl = document.getElementById("top");
  var botEl = document.getElementById("bottom");

  function generateSpans(text) {
    if (!text) return "";
    return text.split("").map(function(char, index) {
      var display = char === " " ? "\u00A0" : char;
      return '<span style="animation-delay:' + (index * 0.1) + 's">' + display + '</span>';
    }).join("");
  }

  function applyRandomFont() {
    var randomFont = fonts[Math.floor(Math.random() * fonts.length)];
    topEl.style.fontFamily = randomFont;
    botEl.style.fontFamily = randomFont;
  }

  function setTextContent() {
    var topText, bottomText;

    if (chosenRare) {
      topText    = chosenRare.topText;
      bottomText = chosenRare.bottomText;
    } else {
      var currentIndex = Math.floor(Math.random() * combinedTexts.length);
      var parts  = combinedTexts[currentIndex].split("-");
      topText    = parts[0] ? parts[0].trim() : "";
      bottomText = parts[1] ? parts[1].trim() : "";
    }

    topEl.innerHTML = generateSpans(topText);
    botEl.innerHTML = generateSpans(bottomText);
  }

  // --- Initial load ---
  applyRandomFont();
  setTextContent();
  topEl.classList.add("anim-enter");
  botEl.classList.add("anim-enter");
  
function setMapName(name) {
  var el    = document.getElementById("mapname-display");
  var badge = document.getElementById("server-badge");

  el.innerText = name;
  el.style.fontSize = "72px";

  var maxWidth = badge.offsetWidth;

  while (el.scrollWidth > maxWidth && parseInt(el.style.fontSize) > 20) {
    el.style.fontSize = (parseInt(el.style.fontSize) - 1) + "px";
  }
}

setMapName("gm_ITSBROKENHELP");

function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, lang, gamemodeNice) {
  setMapName(mapname);
}

  function DownloadingFile(file) {}

  function SetStatusChanged(status) {}


</script>
</body></html>
